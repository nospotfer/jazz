name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.24.2"
          ARCHIVE_NAME="gitleaks_${VERSION}_linux_x64.tar.gz"
          GITLEAKS_URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE_NAME}"
          CHECKSUMS_URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"

          curl -sSLo "${ARCHIVE_NAME}" --fail "${GITLEAKS_URL}"
          curl -sSLo checksums.txt --fail "${CHECKSUMS_URL}"
          grep "${ARCHIVE_NAME}" checksums.txt | sha256sum -c -

          tar -xzf "${ARCHIVE_NAME}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: gitleaks git . --config=jazz-lms/.gitleaks.toml --report-format sarif --report-path gitleaks-results.sarif

      - name: Upload gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: gitleaks-results.sarif
          if-no-files-found: error
