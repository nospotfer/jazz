  <title>Mantenimiento · La Cultura del Jazz</title>
  <style>
:root { color-scheme: light dark; --background: #f4efe3; --surface: #fffcf4; --ink: #20201d; --muted: #57574f; --gold: #8a5b0a; --line: #d6c9af; --hover: #f1e7d0; --button: #f2b705; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { min-width: 0; background: var(--background); }
body { margin: 0; min-height: 100svh; padding: clamp(1rem, 4vw, 3rem); display: grid; place-items: center; color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.65; overflow-wrap: anywhere; }
.page { min-width: 0; width: min(100%, 46rem); padding: clamp(1.5rem, 5vw, 3.5rem); border: 1px solid var(--line); border-radius: 1.25rem; background: var(--surface); box-shadow: 0 1.25rem 4rem #0000000b; }
.identity { display: flex; flex-wrap: wrap; align-items: center; gap: 0.875rem; }
.logo { flex: 0 0 auto; display: block; width: 3.5rem; height: 3.5rem; border-radius: 0.5rem; }
.brand { flex: 1 1 10rem; margin: 0; min-width: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.125rem, 3vw, 1.375rem); line-height: 1.3; overflow-wrap: anywhere; }
.languages { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 1.5rem; }
button { font: inherit; cursor: pointer; }
.language { min-width: 2.75rem; min-height: 2.75rem; padding: 0.5rem; border: 1px solid var(--gold); border-radius: 0.375rem; color: var(--ink); background: transparent; font-size: 0.75rem; font-weight: 650; line-height: 1.2; }
.language:hover { background: var(--hover); }
.language[aria-pressed="true"] { color: #171717; background: var(--button); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
.message { margin-top: clamp(2rem, 6vw, 3rem); }
.eyebrow { margin: 0 0 0.75rem; color: var(--gold); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; }
h1 { margin: 0; max-width: 18ch; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 6vw, 3.25rem); font-weight: 400; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.description { margin: 1.25rem 0 0; max-width: 53ch; }
.hint { margin: 1rem 0 0; max-width: 53ch; color: var(--muted); font-size: 0.9375rem; }
.recheck { min-height: 3rem; max-width: 100%; margin-top: 1.5rem; padding: 0.65rem 1.25rem; border: 1px solid var(--gold); border-radius: 0.5rem; color: #171717; background: var(--button); font-weight: 650; line-height: 1.35; }
.recheck:hover { background: #e2aa00; }
.thanks { margin: 2rem 0 0; padding-top: 1.25rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.875rem; }
@media (prefers-color-scheme: dark) { :root { --background: #0c0e12; --surface: #14171d; --ink: #f5f3ed; --muted: #b9bab7; --gold: #d79b1a; --line: #494037; --hover: #30291a; } }
</style>

    <div id="languages" class="languages" role="group" aria-label="Idioma" hidden>
      <button class="language" type="button" data-language="es" lang="es" aria-label="Español" aria-pressed="true">ES</button>
      <button class="language" type="button" data-language="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
      <button class="language" type="button" data-language="fr" lang="fr" aria-label="Français" aria-pressed="false">FR</button>

    <section class="message" aria-labelledby="heading">
      <p id="eyebrow" class="eyebrow">Mantenimiento</p>
      <h1 id="heading">Hacemos una pausa.</h1>
      <p id="description" class="description">Estamos realizando tareas de mantenimiento. El acceso al curso y las compras no están disponibles temporalmente.</p>
      <p id="hint" class="hint">Puedes volver a cargar esta página más tarde para comprobar si el servicio está disponible.</p>
      <button id="recheck" class="recheck" type="button" hidden>Volver a comprobar</button>
      <noscript><p class="hint">Puedes usar el botón de recarga de tu navegador para volver a comprobarlo.</p></noscript>
    </section>
    <p id="thanks" class="thanks">Gracias por tu paciencia.</p>
  </main>
  <script>
(() => {
  const copy = {
  "es": {
    "htmlLang": "es",
    "title": "Mantenimiento · La Cultura del Jazz",
    "group": "Idioma",
    "eyebrow": "Mantenimiento",
    "heading": "Hacemos una pausa.",
    "description": "Estamos realizando tareas de mantenimiento. El acceso al curso y las compras no están disponibles temporalmente.",
    "hint": "Puedes volver a cargar esta página más tarde para comprobar si el servicio está disponible.",
    "recheck": "Volver a comprobar",
    "thanks": "Gracias por tu paciencia."
  },
  "en": {
    "htmlLang": "en",
    "title": "Maintenance · La Cultura del Jazz",
    "group": "Language",
    "eyebrow": "Maintenance",
    "heading": "We’re taking a pause.",
    "description": "We are carrying out maintenance. Course access and purchases are temporarily unavailable.",
    "hint": "You can reload this page later to check whether the service is available.",
    "recheck": "Check again",
    "thanks": "Thank you for your patience."
  },
  "fr": {
    "htmlLang": "fr",
    "title": "Maintenance · La Cultura del Jazz",
    "group": "Langue",
    "eyebrow": "Maintenance",
    "heading": "Le site fait une pause.",
    "description": "Nous effectuons des opérations de maintenance. L’accès au cours et les achats sont temporairement indisponibles.",
    "hint": "Vous pouvez recharger cette page plus tard pour vérifier si le service est disponible.",
    "recheck": "Vérifier à nouveau",
    "thanks": "Merci de votre patience."
  },
  "pt": {
    "htmlLang": "pt-BR",
    "title": "Manutenção · La Cultura del Jazz",
    "group": "Idioma",
    "eyebrow": "Manutenção",
    "heading": "Uma pausa no site.",
    "description": "Estamos realizando manutenção. O acesso ao curso e as compras estão temporariamente indisponíveis.",
    "hint": "Você pode recarregar esta página mais tarde para verificar se o serviço está disponível.",
    "recheck": "Verificar novamente",
    "thanks": "Obrigado pela paciência."
  }
};
  const controls = document.getElementById('languages');
  const buttons = [...controls.querySelectorAll('button')];
  const recheck = document.getElementById('recheck');
  for (const button of buttons) {
    button.addEventListener('click', () => {
      const language = button.dataset.language;
      const text = copy[language];
      if (!text) return;
      document.documentElement.lang = text.htmlLang;
      document.title = text.title;
      controls.setAttribute('aria-label', text.group);
      for (const key of ['eyebrow', 'heading', 'description', 'hint', 'recheck', 'thanks']) {
        document.getElementById(key).textContent = text[key];
      }
      for (const control of buttons) control.setAttribute('aria-pressed', String(control === button));
    });
  }
  recheck.addEventListener('click', () => {
    const target = new URL(window.location.href);
    if (!['http:', 'https:', 'file:'].includes(target.protocol)) return;
    target.search = '';
    target.hash = '';
    target.username = '';
    target.password = '';
    if (target.protocol !== 'file:') target.pathname = '/';
    window.location.replace(target.href);
  });
  controls.hidden = false;
  recheck.hidden = false;
})();
</script>
